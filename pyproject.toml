[project]
name = "md-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mdanalysis>=2.9.0",
    "networkx>=3.4.2",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scipy>=1.15.3",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=8.39.0",
    "ipywidgets>=8.1.8",
    "mdanalysistests>=2.9.0",
    "pytest>=9.1.1",
]
